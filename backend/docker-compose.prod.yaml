# ============================================================
# MathMotion (Ai-solver) — production, on the same VPS as LingoFlow.
# Same setup as Shadowing-backend/docker-compose.prod.yaml: Arvan handles
# SSL, the aramina project's Traefik only routes by Host() on the
# "web" entrypoint. Only go-api and the admin panel join Traefik's shared
# network; postgres, math-engine and xray stay on this project's own
# private network.
#
# Every service name is prefixed with "mathmotion-" on purpose: LingoFlow
# already has services called "postgres"/"xray"/"backend"/"admin" on the
# shared aramina_net, and Docker DNS would resolve a bare "postgres" from
# go-api (which sits on both networks) to either project's database.
#
# No host ports are published — everything goes through Traefik.
#
# The box is small (1 vCPU, ~2 GB RAM, shared with LingoFlow and
# wallpaper), hence the tight mem/cpu limits and building one image at a
# time (see backend/DEPLOY.md).
#
#   cp .env.prod.example .env    # fill it in
#   docker compose -f docker-compose.prod.yaml up -d --build
# ============================================================

services:
  mathmotion-postgres:
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:15-alpine
    container_name: mathmotion_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mathmotion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mathmotion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mathmotion} -d ${DB_NAME:-mathmotion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    networks:
      - internal

  mathmotion-math-engine:
    build:
      context: ./math-engine
      args:
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: mathmotion_math_engine_prod
    restart: unless-stopped
    # SymPy can spike CPU on a hard input — capped at half of the shared
    # box's single vCPU so it can't starve LingoFlow/wallpaper.
    cpus: 0.5
    mem_limit: 512m
    networks:
      - internal

  # Client-side sidecar for go-api's outbound AI calls when this server's
  # own IP is blocked by a provider — see docs/xray-proxy-setup.md. Starts
  # as a direct passthrough until a vless link is set from the admin
  # panel's «پراکسی Xray» tab (the same link LingoFlow uses works here too).
  mathmotion-xray:
    build:
      context: ./deploy/xray
      args:
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: mathmotion_xray_prod
    restart: unless-stopped
    volumes:
      - xray-config:/etc/xray
    mem_limit: 128m
    networks:
      - internal

  mathmotion-api:
    build:
      context: ./go-api
      args:
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: mathmotion_api_prod
    restart: unless-stopped
    depends_on:
      mathmotion-postgres:
        condition: service_healthy
      mathmotion-math-engine:
        condition: service_started
      mathmotion-xray:
        condition: service_started
    environment:
      ENV: production
      RUN_MIGRATIONS: "true"
      PORT: "8080"
      DB_HOST: mathmotion-postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-mathmotion}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mathmotion}
      MATH_ENGINE_URL: http://mathmotion-math-engine:8000
      # AI provider keys can also be set (and changed later) from the admin
      # panel's «هوش مصنوعی» tab — values saved there override these.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BAZAAR_PACKAGE_NAME: ${BAZAAR_PACKAGE_NAME:-com.mathmotion}
      # The old one-time lifetime unlock; plans for sale (monthly...) are
      # managed in the admin panel's «اشتراک‌ها» tab.
      BAZAAR_PRODUCT_ID: ${BAZAAR_PRODUCT_ID:-mathmotion_premium_unlock}
      # Pishkhan API token for verifying purchases — can also be saved (and
      # changed later) from the admin panel's «اشتراک‌ها» tab.
      BAZAAR_API_SECRET: ${BAZAAR_API_SECRET:-}
      # Signs the login tokens (sign-up / login, internal/service/auth) —
      # changing it logs everyone out.
      JWT_SIGN_KEY: ${JWT_SIGN_KEY:?set JWT_SIGN_KEY}
      # sms.ir, for the sign-up / password-reset codes — can also be saved
      # (and changed later) from the admin panel's «ورود و پیامک» card.
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_OTP_TEMPLATE_ID: ${SMS_IR_OTP_TEMPLATE_ID:-}
      FREE_SOLVE_LIMIT: ${FREE_SOLVE_LIMIT:-5}
      # Fallbacks only — the admin panel's «سهمیه و محدودیت‌ها» overrides these live.
      FREE_QUOTA_PERIOD: ${FREE_QUOTA_PERIOD:-daily}
      FREE_DAILY_LIMIT: ${FREE_DAILY_LIMIT:-3}
      PREMIUM_DAILY_SCAN_LIMIT: ${PREMIUM_DAILY_SCAN_LIMIT:-30}
      # All AI calls leave through the xray sidecar (a no-op passthrough
      # until a vless link is set) — see internal/pkg/outboundhttp.
      AI_OUTBOUND_PROXY: socks5://mathmotion-xray:1080
      XRAY_CONFIG_PATH: /etc/xray/config.json
      # Bearer token the admin panel logs in with (every /admin/* endpoint).
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      # The browser sees the panel over https (Arvan terminates SSL).
      ADMIN_PANEL_ORIGINS: https://${ADMIN_HOST:?set ADMIN_HOST}
    volumes:
      - xray-config:/etc/xray
      # Images uploaded from the admin panel («صفحه‌ی معرفی»), served at /uploads.
      - uploads:/app/uploads
    mem_limit: 256m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mathmotion-api.rule=Host(`${API_HOST:?set API_HOST}`)"
      - "traefik.http.routers.mathmotion-api.entrypoints=web"
      - "traefik.http.services.mathmotion-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=arama_aramina_net"
    networks:
      - internal
      - aramina_net

  # Admin panel (Next.js). NEXT_PUBLIC_API_URL is baked in at build time,
  # so it's the public https API address the operator's browser uses.
  mathmotion-admin:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:?set API_HOST}
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: mathmotion_admin_prod
    restart: unless-stopped
    depends_on:
      - mathmotion-api
    mem_limit: 192m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mathmotion-admin.rule=Host(`${ADMIN_HOST:?set ADMIN_HOST}`)"
      - "traefik.http.routers.mathmotion-admin.entrypoints=web"
      - "traefik.http.services.mathmotion-admin.loadbalancer.server.port=3000"
      - "traefik.docker.network=arama_aramina_net"
    networks:
      - aramina_net

  # The mathmotion.ir landing page (Next.js), content edited in the admin
  # panel's «صفحه‌ی معرفی» tab — the same setup as LingoFlow's landing.
  # It fetches the content server-side from the public API.
  mathmotion-landing:
    build:
      context: ./landing
      args:
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NEXT_PUBLIC_API_URL: https://${API_HOST:?set API_HOST}
    container_name: mathmotion_landing_prod
    restart: unless-stopped
    depends_on:
      - mathmotion-api
    mem_limit: 192m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mathmotion-landing.rule=Host(`${LANDING_HOST:-mathmotion.ir}`) || Host(`www.${LANDING_HOST:-mathmotion.ir}`)"
      - "traefik.http.routers.mathmotion-landing.entrypoints=web"
      - "traefik.http.services.mathmotion-landing.loadbalancer.server.port=3000"
      - "traefik.docker.network=arama_aramina_net"
    networks:
      - aramina_net

volumes:
  pgdata:
  xray-config:
  uploads:

networks:
  internal:
  aramina_net:
    external: true
    name: arama_aramina_net
