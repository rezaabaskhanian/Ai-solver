apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// @cafebazaar/react-native-poolakey (the billing package, autolinked —
// see src/services/billing/poolakey.ts) declares its Poolakey dependency
// as "com.github.cafebazaar.Poolakey:poolakey", which only resolves via
// JitPack — its own android/build.gradle doesn't add that repo itself,
// so the consuming app (us) has to.
repositories {
    maven { url "https://jitpack.io" }
}

// The app version comes from package.json ("version": "1.0.0") — the
// one place to bump it; src/config/version.ts shows it in Settings.
// versionCode (what Cafe Bazaar compares; must grow on every upload) is
// derived from it: 1.0.0 → 10000, 1.0.1 → 10001, 1.2.0 → 10200.
def appVersionName = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def appVersionParts = appVersionName.tokenize('.').collect { it.toInteger() }
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mathmotion"
    defaultConfig {
        applicationId "com.mathmotion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The Cafe Bazaar upload key. Its path and passwords live in
        // ~/.gradle/gradle.properties (never in git), see APP.md:
        //   MATHMOTION_UPLOAD_STORE_FILE=/path/to/mathmotion-upload.keystore
        //   MATHMOTION_UPLOAD_STORE_PASSWORD=...
        //   MATHMOTION_UPLOAD_KEY_ALIAS=mathmotion
        //   MATHMOTION_UPLOAD_KEY_PASSWORD=...
        if (project.hasProperty('MATHMOTION_UPLOAD_STORE_FILE')) {
            release {
                storeFile file(MATHMOTION_UPLOAD_STORE_FILE)
                storePassword MATHMOTION_UPLOAD_STORE_PASSWORD
                keyAlias MATHMOTION_UPLOAD_KEY_ALIAS
                keyPassword MATHMOTION_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the upload key when it's configured (above);
            // otherwise with the debug key — fine for trying a release
            // build, but such an APK must not go to Cafe Bazaar.
            signingConfig project.hasProperty('MATHMOTION_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Compress the native .so libraries inside the APK (AGP stores them
    // uncompressed by default). Cuts the download size roughly in half;
    // the libs are extracted once at install time.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // One APK per architecture instead of a single fat one — distribution is
    // via Cafe Bazaar, not Play (where an AAB would do this automatically).
    // universalApk=false: no extra all-architectures APK is built.
    splits {
        abi {
            reset()
            enable true
            universalApk false
            include "armeabi-v7a", "arm64-v8a"
        }
    }

    // Each architecture's APK gets its own versionCode (e.g. 1001 and 1002),
    // since the store rejects two APKs with the same one. The file name
    // carries the version: MathMotion-v1.0.0-1-arm64-v8a-release.apk
    def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2]
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter("ABI")
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode * 1000 + abiCodes.get(abi)
            }
            outputFileName = "MathMotion-v${variant.versionName}-${variant.versionCode}-${abi ?: "universal"}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ViroReact (AR) — no autolinking, see android/settings.gradle.
    implementation project(':gvr_common')
    implementation project(':arcore_client')
    implementation project(path: ':react_viro')
    implementation project(path: ':viro_renderer')
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.1.1'
    implementation 'com.google.protobuf.nano:protobuf-javanano:3.1.0'
}
